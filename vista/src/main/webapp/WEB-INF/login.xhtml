<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Login - SAUP</title>
</h:head>

<h:body>
    <h:form>
        <p:panel header="Iniciar Sesión">

            <p:messages autoUpdate="true" showDetail="true"/>

            <h:panelGrid columns="2" cellpadding="5">

                <h:outputLabel value="RFC:"/>
                <p:inputText value="#{loginUI.rfc}" required="true"
                             requiredMessage="El RFC es requerido"/>

                <h:outputLabel value="Contraseña:"/>
                <p:password value="#{loginUI.password}" required="true"
                            requiredMessage="La contraseña es requerida"/>

                <h:outputLabel value=""/>
                <p:commandButton value="Entrar"
                                 action="#{loginUI.login}"
                                 ajax="false"/>
            </h:panelGrid>

        </p:panel>
    </h:form>
</h:body>
</html>
