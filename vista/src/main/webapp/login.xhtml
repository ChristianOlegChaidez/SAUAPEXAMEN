<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>SAUP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Inter, Arial, sans-serif; background: white; }

        .header {
            background-color: #297352;
            color: black;
            padding: 0 45px;
            height: 82px;
            display: flex;
            align-items: center;
            font-size: 38px;
            font-weight: 800;
        }

        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 95px;
            background-color: #c4bb62;
            padding: 20px;
        }

        .contenido {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
            gap: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 18px;
        }

        .campo .ui-inputtext,
        .campo .ui-password {
            width: 192px !important;
            height: 38px !important;
            background-color: #d9d9d9 !important;
            border: 2px solid #000 !important;
            border-radius: 20px !important;
            padding: 0 15px !important;
            font-size: 14px !important;
            box-shadow: none !important;
        }

        .boton-login {
            margin-top: 30px;
            background-color: #d9d9d9 !important;
            color: black !important;
            border: 2px solid #000 !important;
            border-radius: 20px !important;
            width: 148px !important;
            height: 28px !important;
            font-size: 13px !important;
            font-weight: normal !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        .ui-growl-item-container {
            background-color: #888 !important;
            border: none !important;
            border-radius: 4px !important;
            overflow: hidden !important;
        }

        .ui-growl-error .ui-growl-item {
            background-color: #888 !important;
            padding: 0 !important;
        }

        .ui-growl-error .ui-growl-item:before {
            content: 'Error' !important;
            display: block !important;
            background-color: #e53935 !important;
            color: white !important;
            padding: 8px 12px !important;
            font-weight: bold !important;
        }

        .ui-growl-item .ui-growl-image {
            display: none !important;
        }

        .ui-growl-message {
            padding: 10px !important;
            color: black !important;
        }

        .ui-growl-title {
            display: none !important;
        }
    </style>
</h:head>

<h:body>
    <div class="header">Sauap</div>

    <h:form>
        <p:growl id="messages" showDetail="true" showSummary="false" life="4000"/>

        <div class="contenido">
            <div class="campo">
                <p:outputLabel value="Usuario"/>
                <p:inputText value="#{loginBeanUI.usuario}" required="true"/>
            </div>
            <div class="campo">
                <p:outputLabel value="Contraseña"/>
                <p:password value="#{loginBeanUI.password}" required="true" feedback="false"/>
            </div>
            <p:commandButton value="Inicia sesión"
                             styleClass="boton-login"
                             action="#{loginBeanUI.login()}"
                             update="messages @form"/>
        </div>

        <div class="footer"></div>
    </h:form>
</h:body>
</html>
