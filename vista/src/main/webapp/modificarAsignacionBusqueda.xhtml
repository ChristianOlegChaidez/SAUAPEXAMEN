<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
<f:view>
    <h:head>
        <style>
            .encabezado {
                background-color: #2A714F;
                color: black;
                padding: 15px;
                margin: 0;
            }
            .piePagina {
                background-color: #A29201;
                color: white;
                padding: 15px;
                margin-top: auto;
                font-size: 24px;
            }
            html, body {
                height: 100%;
                margin: 0;
            }
            body {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }
        </style>
    </h:head>
    <h:body>
        <div class="encabezado">
            <h1 style="margin: 0">Modificacion de Asignaciones</h1>
        </div>

        <h:form style="margin: 20px;">
            <p:outputLabel value="Busqueda por unidad" />
            <br/>
            <p:inputText value="#{modificarAsignacionUI.nombreUnidadBusqueda}" placeholder="Nombre de la unidad de aprendizaje" />
            <p:commandButton value="Consultar"
                             action="#{modificarAsignacionUI.buscarPorUnidad()}" />
        </h:form>
        <div class="piePagina">
            <p:commandLink value="🔙" action="index?faces-redirect=true"></p:commandLink>
        </div>
    </h:body>
</f:view>
</html>
