<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>SAUP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: white; }

        .header {
            background-color: #1a6b4a;
            color: black;
            padding: 20px 30px;
            font-size: 36px;
            font-weight: bold;
        }

        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #c8b84a;
            padding: 20px;
        }

        .contenido {
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 80px;
        }

        .btn-menu {
            padding: 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: #d9d9d9;
            border: 2px solid #333;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        .btn-menu:hover {
            background-color: #c0c0c0;
        }
    </style>
</h:head>

<h:body>
    <div class="header">Sauap</div>

    <div class="contenido">
        <a class="btn-menu" href="altasProfesores.xhtml">Alta profesores</a>
        <a class="btn-menu" href="#">Alta asignacion</a>
        <a class="btn-menu" href="altaUnidadAprendizaje.xhtml">Alta unidad de aprendizaje</a>
        <a class="btn-menu" href="modificarAsignacionBusqueda.xhtml">Modificacion asignacion</a>
        <a class="btn-menu" href="#">Modificacion unidad de aprendizaje</a>
        <a class="btn-menu" href="eliminarUnidadAprendizaje.xhtml">Eliminar unidad de aprendizaje</a>
        <a class="btn-menu" href="#">Eliminar asignacion</a>
        <a class="btn-menu" href="#">Consulta unidad de aprendizaje</a>
        <a class="btn-menu" href="consultaAsignaciones.xhtml">Consulta asignacion</a>
    </div>

    <div class="footer"></div>
</h:body>
</html>
